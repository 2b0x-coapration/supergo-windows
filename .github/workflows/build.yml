name: Build SUPERGO (Windows 7+)
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: x64
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m PyInstaller --noconfirm --onefile --windowed --icon supergo.ico --add-data "supergo.png;." --name SUPERGO supergo.py
      - uses: actions/upload-artifact@v4
        with:
          name: SUPERGO-win7
          path: dist/SUPERGO.exe
